# `knave upgrade` rewrites `knave.yml`. This workflow holds the kogworks checks.
name: Kogworks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ledelint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-knave
      - name: Check the declaration order
        run: knave task ledelint

  factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-knave
      - name: Check
        run: knave check
      - name: Format
        run: knave fmt --check
      - name: Lint
        run: knave lint
      - name: Build
        run: knave build
      - name: Check the factory
        run: ./target/knave/kogworks/kogworks check .kogworks
      - name: Test
        run: knave test
