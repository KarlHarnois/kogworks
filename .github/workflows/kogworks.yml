# `knave upgrade` rewrites `knave.yml`. This workflow holds the kogworks checks.
name: Kogworks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ledelint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-knave
      - name: Check the declaration order
        run: knave task ledelint

  factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-knave
      - name: Check
        run: knave check
      - name: Format
        run: knave fmt --check
      - name: Lint
        run: knave lint
      - name: Build
        run: knave build
      - name: Keep the README's `kogworks --help` in sync with the CLI
        run: |
          knave task sync-readme-help
          if ! git diff --exit-code README.md; then
            echo "The Usage section of README.md no longer matches \`kogworks --help\`. Run \`knave task sync-readme-help\` and commit README.md."
            exit 1
          fi
      - name: Check the factory
        run: ./target/knave/kogworks/kogworks check .kogworks
      - name: Test
        run: knave test
